services:
  match-service:
    depends_on:
      league-service:
        condition: service_healthy
      shot-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    build: ./match-service
    environment:
      LEAGUE_SVC_URL: http://league-service:8082
      SHOT_SVC_URL: http://shot-service:8081
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

###
  shot-service:
    build: ./shot-service
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  ###
  league-service:
    depends_on:
      postgres:
        condition: service_healthy
    build: ./league-service
    environment:
      DB_HOST: postgres
      DB_NAME: micropool
      DB_USER: sqd
      DB_PASSWORD: spud
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
###
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: micropool
      POSTGRES_USER: sqd
      POSTGRES_PASSWORD: spud
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U sqd -d micropool" ]
      interval: 10s
      timeout: 5s
      retries: 5